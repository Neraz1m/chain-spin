<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c0e13"><meta name="description" content="Draw a named option using verifiable Bitcoin, Ethereum, and Solana block data.">
<title>Option Board · ChainSpin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23bcf97b'/%3E%3Cpath d='m23 5-15 18h10l-2 12 16-21H21z' fill='%23141916'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css"><script defer src="protocol.js"></script><script defer src="network.js"></script><script defer src="board.js"></script><script defer src="app.js"></script>
</head><body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<symbol id="i-bolt" viewBox="0 0 24 24"><path d="m14.5 1-12 13H11L8.5 23l14-16H14z" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
<symbol id="i-history" viewBox="0 0 24 24"><path d="M3.5 10a8.5 8.5 0 1 1 1.6 7M3 4.5v6h6M12 7v5l3.5 2"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5.5C8.5 3.7 5.5 4 2.5 5v14c3-1 6-1.3 9.5.5 3.5-1.8 6.5-1.5 9.5-.5V5c-3-1-6-1.3-9.5.5Zm0 0v14"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M3 7h5m5 0h8M3 17h11m5 0h2"/><circle cx="10.5" cy="7" r="2.5"/><circle cx="16.5" cy="17" r="2.5"/></symbol>
<symbol id="i-activity" viewBox="0 0 24 24"><path d="M2 12h5l3-8 4 16 3-8h5"/></symbol>
<symbol id="i-hex" viewBox="0 0 24 24"><path d="m12 2 8.5 5v10L12 22l-8.5-5V7L12 2Zm0 10 8.5-5M12 12 3.5 7M12 12v10"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.3 4.2L19 7"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 2 8 3v6c0 5-3.6 8.5-8 11-4.4-2.5-8-6-8-11V5z"/><path d="m8 11.5 3 3 5-5"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3M7 8l5-5 5 5M4 16v5h16v-5"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v13M7 11l5 5 5-5M4 16v5h16v-5"/></symbol>
<symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7m0-7L10 14M10 5H4v15h15v-6"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 15-1 6 6-1L21 8a2 2 0 0 0 0-3l-2-2a2 2 0 0 0-3 0L4 15Zm10-10 5 5M4 15l5 5"/></symbol>
<symbol id="i-delete" viewBox="0 0 24 24"><path d="M3 6h18M8 6V3h8v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M6 3.8c0-.9 1-1.5 1.8-1l13.3 8.2a1.2 1.2 0 0 1 0 2L7.8 21.2c-.8.5-1.8-.1-1.8-1z"/></symbol>
</svg>
<header><div class="topbar wrap"><a class="brand" href="#board" aria-label="ChainSpin home"><svg><use href="#i-bolt"/></svg>ChainSpin</a>
<nav aria-label="Main navigation"><a href="#board" data-view="board"><svg><use href="#i-board"/></svg>Board</a><a href="#history" data-view="history"><svg><use href="#i-history"/></svg>History</a><a href="#rules" data-view="rules"><svg><use href="#i-book"/></svg>Protocol</a></nav>
<span class="mainnet" aria-label="Supported chains">BTC <i>/</i> ETH <i>/</i> SOL</span></div></header>
<main class="wrap">
<section id="view-board">
<div class="intro"><h1>Option Board</h1><span class="clock"><svg><use href="#i-clock"/></svg><span id="utc">--:--:-- UTC</span></span></div>
<div class="workbench">
<section class="panel board-panel" aria-label="Option board"><div class="panel-head"><h2 class="board-state" id="board-status" role="status"><i></i><span>Ready</span></h2><span class="odds" id="chance">1 in 16 per tile</span></div>
<div class="board-body"><div id="tile-board" aria-label="Draw options">
<div id="monitor" class="monitor">
<div class="monitor-controls" id="monitor-controls">
<button type="button" id="add-option" class="instrument-key" aria-label="Add option" title="Add option"><svg><use href="#i-plus"/></svg><span>Add</span></button>
<div class="readout"><strong class="matrix" id="total" aria-live="polite">16</strong><span>Total options</span></div>
<button type="button" id="edit-options" class="instrument-key" aria-pressed="false" aria-label="Edit options" title="Edit options"><svg><use id="edit-icon" href="#i-edit"/></svg><span id="edit-label">Edit</span></button>
</div><div class="screen-message" id="screen-message" hidden role="status"><small id="screen-label"></small><strong id="screen-value"></strong></div>
</div></div>
<button type="button" disabled class="primary" id="start"><svg><use href="#i-play"/></svg><span>Start draw</span></button></div></section>
<aside class="sidebar">
<section class="settings panel"><div class="panel-head"><h2><svg><use href="#i-settings"/></svg>Draw settings</h2></div><div class="settings-body">
<fieldset disabled id="chains-field"><legend>Participating chains</legend><div class="chain-options" id="chain-options"></div></fieldset>
<fieldset disabled id="modes-field"><legend>Draw timing</legend><div class="modes" id="modes"><button type="button" data-mode="second" aria-pressed="true">1 second</button><button type="button" data-mode="minute" aria-pressed="false">1 minute</button><button type="button" data-mode="next" aria-pressed="false">Next block</button></div>
<div id="trigger-row" hidden><label for="trigger">Trigger chain</label><select id="trigger"><option value="eth">Ethereum (ETH)</option><option value="btc">Bitcoin (BTC)</option></select></div><p class="hint" id="mode-hint"></p></fieldset>
</div></section>
<section class="panel live-panel"><div class="panel-head"><h2><svg><use href="#i-activity"/></svg>Live blocks</h2><span class="socket-tag">WSS</span></div><div id="network-grid"></div></section>
</aside></div>
<section id="progress-panel" class="panel progress-panel" hidden aria-live="polite"><div><h2 id="progress-title"></h2><p id="progress-text"></p><code id="progress-hash"></code></div><div class="inline-actions" id="progress-actions"></div></section>
</section>
<section id="view-history" hidden><div class="intro"><h1>Draw history</h1><button class="secondary" id="import-button"><svg aria-hidden="true"><use href="#i-upload"/></svg>Import receipt</button><input id="import-file" type="file" accept="application/json,.json" hidden></div><div id="history-list"></div></section>
<section id="view-rules" hidden><div class="intro"><h1>Draw protocol</h1></div><div class="rules panel" id="rules"></div></section>
<footer><span class="footer-brand"><svg><use href="#i-bolt"/></svg>ChainSpin</span><div class="footer-links"><span>Mainnet <b>·</b> Protocol v2</span><a class="repository-link" href="https://github.com/Neraz1m/chain-spin" aria-label="ChainSpin source on GitHub">GitHub <svg aria-hidden="true"><use href="#i-external"/></svg></a></div></footer></main>
<dialog id="detail"><div class="dialog-head"><h2 id="dialog-title">Draw receipt</h2><button aria-label="Close receipt" id="close-detail">×</button></div><div id="dialog-body"></div></dialog>
<div id="toast" role="status" hidden></div>
</body></html>
